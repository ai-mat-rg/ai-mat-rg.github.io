---
layout: main
---
<div class="columns is-vcentered">
  {% if page.image %}
  <div class="column is-one-fifth content">
    <figure class="image">
      <img src="{{ page.image }}">
    </figure>
  </div>
  {% endif %}
  <div class="column content">
    <h1>{{ site.title }}</h1>
    {{ content }}
  </div>
</div>
